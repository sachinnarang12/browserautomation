[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x720x24
autostart=true
autorestart=true
priority=10
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb-err.log
environment=HOME="/home/portal"

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -nopw -listen 0.0.0.0 -rfbport 5900 -shared -forever -noxdamage
autostart=true
autorestart=true
priority=20
stdout_logfile=/tmp/x11vnc.log
stderr_logfile=/tmp/x11vnc-err.log
environment=DISPLAY=":99"
startsecs=3

[program:novnc]
command=/opt/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080
autostart=true
autorestart=true
priority=30
stdout_logfile=/tmp/novnc.log
stderr_logfile=/tmp/novnc-err.log
startsecs=3

[program:gunicorn]
command=/usr/local/bin/gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 --timeout 120 agent_dashboard_v2:app
directory=/app
autostart=true
autorestart=true
priority=40
stdout_logfile=/tmp/gunicorn.log
stderr_logfile=/tmp/gunicorn-err.log
user=portal
environment=DISPLAY=":99",HOME="/home/portal",PYTHONUNBUFFERED="1",NOVA_ACT_API_KEY="%(ENV_NOVA_ACT_API_KEY)s",FLASK_SECRET_KEY="%(ENV_FLASK_SECRET_KEY)s",AUTOMATEPORTAL_EDITION="%(ENV_AUTOMATEPORTAL_EDITION)s",AUTOMATEPORTAL_LICENSE_SECRET="%(ENV_AUTOMATEPORTAL_LICENSE_SECRET)s",PLAYWRIGHT_BROWSERS_PATH="/opt/pw-browsers",NOVA_ACT_SKIP_PLAYWRIGHT_INSTALL="1"

[program:scheduler]
command=/usr/local/bin/python /app/standalone_scheduler.py
directory=/app
autostart=true
autorestart=true
priority=50
stdout_logfile=/tmp/scheduler.log
stderr_logfile=/tmp/scheduler-err.log
user=portal
startsecs=5
environment=DISPLAY=":99",HOME="/home/portal",PYTHONUNBUFFERED="1",NOVA_ACT_API_KEY="%(ENV_NOVA_ACT_API_KEY)s",AUTOMATEPORTAL_EDITION="%(ENV_AUTOMATEPORTAL_EDITION)s",AUTOMATEPORTAL_LICENSE_SECRET="%(ENV_AUTOMATEPORTAL_LICENSE_SECRET)s",PLAYWRIGHT_BROWSERS_PATH="/opt/pw-browsers",NOVA_ACT_SKIP_PLAYWRIGHT_INSTALL="1"
