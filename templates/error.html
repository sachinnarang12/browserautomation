{% extends "base_v2.html" %}

{% block title %}Error {{ error_code }} - Portal Automation Agent{% endblock %}

{% block content %}
<div class="flex min-h-[60vh] flex-col items-center justify-center px-6 py-24 sm:py-32 lg:px-8">
    <div class="text-center">
        <p class="text-base font-semibold text-indigo-600">{{ error_code }}</p>
        <h1 class="mt-4 text-3xl font-bold tracking-tight text-gray-900 sm:text-5xl">{{ error_message }}</h1>
        <p class="mt-6 text-base leading-7 text-gray-600">Sorry, something went wrong.</p>
        <div class="mt-10 flex items-center justify-center gap-x-6">
            <a href="{{ url_for('dashboard') if user and user.is_authenticated else url_for('login') }}"
               class="rounded-md bg-indigo-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500">
                Go back home
            </a>
        </div>
    </div>
</div>
{% endblock %}
